<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament List</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2, h3 { color: #1e3c72; font-family: 'Oswald', sans-serif; text-transform: uppercase; margin-top: 0; }
        .box { background: #f9f9f9; padding: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; color: #444; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #218838; }
        .tournament-list { list-style: none; padding: 0; margin-top: 10px; }
        .tournament-item { background: #fff; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
        .tournament-name-text { color: #1e3c72; font-weight: bold; font-size: 16px; flex: 1; }
        .btn-delete-icon { background: rgba(220, 53, 69, 0.1); color: #dc3545; border: 1px solid rgba(220, 53, 69, 0.3); width: 32px; height: 32px; border-radius: 5px; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-delete-icon:hover { background: #dc3545; color: white; }
    </style>
</head>
<body>

<div class="container" id="mainContainer" style="display: none;">
    <!-- টুর্নামেন্ট ক্রিয়েট করার বক্স -->
    <div class="box">
        <h3>➕ Create New Tournament</h3>
        <label>Tournament Name</label>
        <input type="text" id="tourNameInput" placeholder="e.g. Summer Premier League 2026">
        <button class="btn" onclick="window.createTournament()">Create Tournament</button>
    </div>

    <!-- টুর্নামেন্ট লিস্ট -->
    <div class="box">
        <h3>📋 My Tournaments List</h3>
        <ul id="tournamentsListContainer" class="tournament-list">
            <li style="text-align:center; color:#888; width: 100%;">Loading tournaments...</li>
        </ul>
    </div>
</div>

<!-- Firebase Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getDatabase, ref, get, set, push, remove } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
      authDomain: "cricket-score-d187a.firebaseapp.com",
      databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
      projectId: "cricket-score-d187a",
      storageBucket: "cricket-score-d187a.firebasestorage.app",
      messagingSenderId: "782741896785",
      appId: "1:782741896785:android:ca8c45a9120f7784928270"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let currentUsername = urlParams.get('u') || localStorage.getItem('proCricketUsername');
    let currentUserId = "";

    window.createTournament = async function() {
        const tName = document.getElementById('tourNameInput').value.trim();
        if (!tName) {
            alert("⚠️ Please enter a tournament name!");
            return;
        }

        try {
            const newTourRef = push(ref(db, `users/${currentUserId}/tournaments`));
            await set(newTourRef, {
                name: tName,
                createdAt: Date.now()
            });
            document.getElementById('tourNameInput').value = "";
            loadAllTournaments();
            alert("🏆 Tournament created successfully!");
        } catch (err) {
            alert("❌ Failed to create tournament.");
        }
    };

    async function loadAllTournaments() {
        const container = document.getElementById('tournamentsListContainer');
        container.innerHTML = "<li style='text-align:center; color:#888; width: 100%;'>Loading tournaments...</li>";

        try {
            const tourSnap = await get(ref(db, `users/${currentUserId}/tournaments`));
            
            if (tourSnap.exists()) {
                const tours = tourSnap.val();
                container.innerHTML = "";
                
                Object.keys(tours).forEach(tId => {
                    const tour = tours[tId];
                    let li = document.createElement('li');
                    li.className = "tournament-item";
                    
                    // এখানে লিংকের ট্যাগ বাদ দেওয়া হয়েছে, এখন শুধু নাম এবং ডাস্টবিন আইকন থাকবে
                    li.innerHTML = `
                        <span class="tournament-name-text">🏆 ${tour.name || 'Unnamed Tournament'}</span>
                        <button class="btn-delete-icon" onclick="window.deleteTournament('${tId}')" title="Delete Tournament">🗑️</button>
                    `;
                    container.appendChild(li);
                });
            } else {
                container.innerHTML = "<li style='text-align:center; color:#888; width: 100%;'>No tournaments found. Create one above!</li>";
            }
        } catch (e) {
            container.innerHTML = "<li style='text-align:center; color:red; width: 100%;'>Error loading tournaments.</li>";
        }
    }

    window.deleteTournament = async function(tId) {
        if (!confirm("⚠️ Are you sure you want to delete this tournament?")) return;
        try {
            await remove(ref(db, `users/${currentUserId}/tournaments/${tId}`));
            alert("🗑️ Tournament deleted successfully!");
            loadAllTournaments();
        } catch (err) {
            alert("❌ Failed to delete tournament.");
        }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            if (!currentUsername) {
                currentUsername = localStorage.getItem('proCricketUsername') || "user";
            }
            document.getElementById('mainContainer').style.display = 'block';
            loadAllTournaments();
        } else {
            alert("⚠️ Unauthorized access! Please login first.");
            window.location.href = "index.html";
        }
    });
</script>

</body>
</html>
