<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-nav { border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px; }
        h2, h3 { color: #1e3c72; font-family: 'Oswald', sans-serif; text-transform: uppercase; margin: 0; }
        .box { background: #f9f9f9; padding: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #218838; }

        .team-list, .match-list { list-style: none; padding: 0; margin-top: 10px; }
        .team-item { background: #fff; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
        .team-header-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #fff; cursor: pointer; }
        .team-name-text { font-weight: bold; color: #1e3c72; font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .squad-dropdown-content { display: none; padding: 15px; background: #f8fafc; border-top: 1px solid #eee; }
        .squad-dropdown-content.open { display: block; }
        .player-row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 5px; margin-bottom: 6px; font-size: 14px; }
        .btn-edit-player { background: rgba(0, 86, 179, 0.1); color: #0056b3; border: 1px solid rgba(0, 86, 179, 0.3); padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        
        .match-item { background: #fff; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .match-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #1e3c72; font-size: 14px; width: 100%; flex-wrap: wrap; gap: 10px; }
        .btn-delete-icon { background: rgba(220, 53, 69, 0.1); color: #dc3545; border: 1px solid rgba(220, 53, 69, 0.3); width: 32px; height: 32px; border-radius: 5px; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-launch-match { background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: none; }
        .completed-badge { background: #e2e8f0; color: #2d3748; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="header-nav">
        <h2 id="tourTitle">🏆 Tournament Panel</h2>
    </div>

    <!-- টুর্নামেন্ট সিলেকশন ড্রপডাউন বক্স -->
    <div class="box" style="background: #eef2f7; border-color: #cbd5e1;">
        <label for="tournamentSelect" style="color: #1e3c72; font-size: 15px;">📌 Select Active Tournament:</label>
        <select id="tournamentSelect" onchange="window.switchTournament(this.value)">
            <option value="">-- Choose a Tournament --</option>
        </select>
    </div>

    <!-- টিম ও স্কোয়াড ম্যানেজমেন্ট সেকশন -->
    <div class="box" style="background: #f0f7ff; border-color: #b8daff;">
        <h3 style="color: #0056b3;">👥 Add Team & Player Squad</h3>
        <label>Team Name</label>
        <input type="text" id="teamNameInput" placeholder="e.g. Kolkata Tigers">

        <label>Players List (Put (c) first, then (wk), each on a new line)</label>
        <textarea id="squadInput" rows="4" placeholder="Player 1 (c)&#10;Player 2 (wk)&#10;Player 3"></textarea>

        <button class="btn" style="background: #0056b3;" onclick="window.saveTeamWithSquad()">💾 Save Team & Squad</button>
        
        <h4 style="margin-top: 20px; color: #333;">Registered Teams:</h4>
        <ul id="teamsListContainer" class="team-list">
            <li style="color: #888; font-size: 14px; width: 100%; padding: 10px;">No tournament selected or no teams added.</li>
        </ul>
    </div>

    <!-- ম্যাচ শিডিউল তৈরি করার সেকশন -->
    <div class="box">
        <h3>⚔️ Schedule New Match</h3>
        <label>Select Team 1</label>
        <select id="team1Select" onchange="window.filterTeams()"><option value="">-- Select Team 1 --</option></select>

        <label>Select Team 2</label>
        <select id="team2Select" onchange="window.filterTeams()"><option value="">-- Select Team 2 --</option></select>

        <label>Number of Overs</label>
        <input type="number" id="matchOversInput" value="10" min="1" max="50">

        <label>Match Type / Format</label>
        <select id="matchTypeSelect">
            <option value="League">League Match</option>
            <option value="Knockout">Knockout</option>
        </select>

        <button class="btn" style="background: #007bff;" onclick="window.scheduleMatch()">📅 Save / Schedule Match to List</button>
    </div>

    <!-- ম্যাচ হিস্ট্রি ও শিডিউল লিস্ট -->
    <div class="box">
        <h3>📜 Tournament Matches & Schedule</h3>
        <ul id="matchesListContainer" class="match-list">
            <li style="color: #888; font-size: 14px; width: 100%;">No matches scheduled yet.</li>
        </ul>
    </div>
</div>

<!-- Firebase Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getDatabase, ref, get, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
      authDomain: "cricket-score-d187a.firebaseapp.com",
      databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
      projectId: "cricket-score-d187a",
      storageBucket: "cricket-score-d187a.firebasestorage.app",
      messagingSenderId: "782741896785",
      appId: "1:782741896785:android:ca8c45a9120f7784928270"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let tourId = urlParams.get('t');
    let currentUsername = urlParams.get('u') || localStorage.getItem('proCricketUsername');

    let currentUserId = "";
    let globalTeamsData = {};

    async function initTournamentPanel() {
        try {
            const tourSnap = await get(ref(db, `users/${currentUserId}/tournaments`));
            const selectDropdown = document.getElementById('tournamentSelect');
            selectDropdown.innerHTML = '<option value="">-- Choose a Tournament --</option>';

            if (tourSnap.exists()) {
                const tournaments = tourSnap.val();
                Object.keys(tournaments).forEach(tId => {
                    const tourName = tournaments[tId].name || "Unnamed Tournament";
                    let opt = document.createElement('option');
                    opt.value = tId;
                    opt.innerText = tourName;
                    if (tId === tourId) {
                        opt.selected = true;
                    }
                    selectDropdown.appendChild(opt);
                });
            }

            if (tourId) {
                loadTournamentData(tourId);
            }
        } catch (err) {
            console.error("Error initializing tournament panel:", err);
        }
    }

    window.switchTournament = function(selectedTourId) {
        if (!selectedTourId) return;
        tourId = selectedTourId;
        const newUrl = `TournamentPanel.html?t=${tourId}&u=${currentUsername}`;
        window.history.pushState({path: newUrl}, '', newUrl);
        loadTournamentData(tourId);
    };

    async function loadTournamentData(tId) {
        try {
            const tourRef = ref(db, `users/${currentUserId}/tournaments/${tId}`);
            const tourSnap = await get(tourRef);
            if (tourSnap.exists()) {
                document.getElementById('tourTitle').innerText = "🏆 " + (tourSnap.val().name || "Tournament");
            } else {
                document.getElementById('tourTitle').innerText = "🏆 Tournament Panel";
            }

            loadTeamsAndSquads();
            loadMatchesList();
        } catch (err) {
            console.error("Error loading tournament data:", err);
        }
    }

    window.saveTeamWithSquad = async function() {
        if (!tourId) {
            alert("⚠️ Please select a tournament from the dropdown first!");
            return;
        }
        const teamName = document.getElementById('teamNameInput').value.trim();
        const squadText = document.getElementById('squadInput').value.trim();

        if (!teamName) {
            alert("⚠️ Please enter a team name!");
            return;
        }

        let players = squadText ? squadText.split('\n').map(p => p.trim()).filter(p => p.length > 0) : [];

        try {
            const teamRef = ref(db, `users/${currentUserId}/tournaments/${tourId}/teams/${teamName}`);
            await set(teamRef, {
                name: teamName,
                players: players
            });

            document.getElementById('teamNameInput').value = "";
            document.getElementById('squadInput').value = "";
            loadTeamsAndSquads();
            alert(`✅ Team '${teamName}' saved successfully!`);
        } catch (err) {
            alert("❌ Failed to save team.");
        }
    };

    window.deleteTeam = async function(teamName) {
        if (!tourId) return;
        if (!confirm(`⚠️ Are you sure you want to delete the team '${teamName}'?`)) return;
        try {
            const teamRef = ref(db, `users/${currentUserId}/tournaments/${tourId}/teams/${teamName}`);
            await remove(teamRef);
            loadTeamsAndSquads();
        } catch (err) {
            alert("❌ Failed to delete team.");
        }
    };

    window.toggleSquadDropdown = function(element) {
        element.nextElementSibling.classList.toggle('open');
    };

    window.editPlayerName = async function(teamName, playerIndex, currentPlayerName) {
        if (!tourId) return;
        const newName = prompt("✏️ Edit Player Name:", currentPlayerName);
        if (newName === null || newName.trim() === "") return;

        try {
            const teamRef = ref(db, `users/${currentUserId}/tournaments/${tourId}/teams/${teamName}`);
            const snap = await get(teamRef);
            if (snap.exists()) {
                let teamData = snap.val();
                if (teamData.players && teamData.players[playerIndex] !== undefined) {
                    teamData.players[playerIndex] = newName.trim();
                    await set(teamRef, teamData);
                    loadTeamsAndSquads();
                }
            }
        } catch (err) {
            alert("❌ Failed to update player name.");
        }
    };

    async function loadTeamsAndSquads() {
        if (!tourId) return;
        const teamsContainer = document.getElementById('teamsListContainer');
        teamsContainer.innerHTML = "";

        try {
            const teamsSnap = await get(ref(db, `users/${currentUserId}/tournaments/${tourId}/teams`));
            if (teamsSnap.exists()) {
                globalTeamsData = teamsSnap.val();
                
                Object.keys(globalTeamsData).forEach(teamKey => {
                    const team = globalTeamsData[teamKey];
                    let li = document.createElement('li');
                    li.className = "team-item";
                    
                    let playersHTML = '';
                    if (team.players && Array.isArray(team.players)) {
                        team.players.forEach((player, idx) => {
                            playersHTML += `
                                <div class="player-row">
                                    <span>👤 ${player}</span>
                                    <button class="btn-edit-player" onclick="window.editPlayerName('${team.name}', ${idx}, '${player}')">✏ Edit</button>
                                </div>
                            `;
                        });
                    } else {
                        playersHTML = '<div style="color: #888; font-size: 13px;">No players found</div>';
                    }

                    li.innerHTML = `
                        <div class="team-header-row" onclick="window.toggleSquadDropdown(this)">
                            <span class="team-name-text">🏏 ${team.name} <span style="font-size:12px; color:#666; font-weight:normal;">(Click to view squad ▾)</span></span>
                            <button class="btn-delete-icon" onclick="event.stopPropagation(); window.deleteTeam('${team.name}')" title="Delete Team">🗑️</button>
                        </div>
                        <div class="squad-dropdown-content">
                            <h5 style="margin: 0 0 8px 0; color: #1e3c72;">Player Squad:</h5>
                            ${playersHTML}
                        </div>
                    `;
                    teamsContainer.appendChild(li);
                });
                updateTeamDropdowns();
            } else {
                globalTeamsData = {};
                teamsContainer.innerHTML = '<li style="color: #888; font-size: 14px; width: 100%; padding: 10px;">No teams added yet.</li>';
                updateTeamDropdowns();
            }
        } catch (e) {
            console.error("Error loading teams:", e);
        }
    }

    window.updateTeamDropdowns = function() {
        const team1Select = document.getElementById('team1Select');
        const team2Select = document.getElementById('team2Select');
        const selectedTeam1 = team1Select.value;
        const selectedTeam2 = team2Select.value;

        team1Select.innerHTML = '<option value="">-- Select Team 1 --</option>';
        team2Select.innerHTML = '<option value="">-- Select Team 2 --</option>';

        Object.keys(globalTeamsData).forEach(teamKey => {
            const teamName = globalTeamsData[teamKey].name;
            if (teamName !== selectedTeam2) {
                let opt1 = document.createElement('option');
                opt1.value = teamName;
                opt1.innerText = teamName;
                if (teamName === selectedTeam1) opt1.selected = true;
                team1Select.appendChild(opt1);
            }
            if (teamName !== selectedTeam1) {
                let opt2 = document.createElement('option');
                opt2.value = teamName;
                opt2.innerText = teamName;
                if (teamName === selectedTeam2) opt2.selected = true;
                team2Select.appendChild(opt2);
            }
        });
    };

    window.filterTeams = function() {
        updateTeamDropdowns();
    };

    async function loadMatchesList() {
        if (!tourId) return;
        const matchesContainer = document.getElementById('matchesListContainer');
        matchesContainer.innerHTML = "<li style='text-align:center; color:#888; width: 100%;'>Loading matches...</li>";

        try {
            const matchesSnap = await get(ref(db, `users/${currentUserId}/tournaments/${tourId}/matches`));
            if (matchesSnap.exists()) {
                const matches = matchesSnap.val();
                matchesContainer.innerHTML = "";

                Object.keys(matches).forEach(matchId => {
                    const match = matches[matchId];
                    let li = document.createElement('li');
                    li.className = "match-item";
                    
                    let isCompleted = match.status === "completed";
                    let isRunning = match.status === "running";

                    let safeTeam1 = (match.team1 || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    let safeTeam2 = (match.team2 || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");

                    let actionButton = "";
                    if (isCompleted) {
                        actionButton = `<span class="completed-badge">Completed (${match.winner || 'Finished'})</span>`;
                    } else if (isRunning) {
                        actionButton = `<button class="btn-launch-match" style="background: #28a745;" onclick="window.launchOrResumeMatch(this, '${matchId}', '${safeTeam1}', '${safeTeam2}', '${match.overs || 10}', '${match.type || 'League'}')">▶️ Resume Match</button>`;
                    } else {
                        actionButton = `<button class="btn-launch-match" onclick="window.launchOrResumeMatch(this, '${matchId}', '${safeTeam1}', '${safeTeam2}', '${match.overs || 10}', '${match.type || 'League'}')">🚀 Launch Match</button>`;
                    }

                    li.innerHTML = `
                        <div class="match-header">
                            <span>🏏 ${match.team1} vs ${match.team2} (${match.overs || 10} Ov, ${match.type || 'League'})</span>
                            <div style="display: flex; align-items: center; gap: 10px;">
                                ${actionButton}
                                <button class="btn-delete-icon" onclick="window.deleteMatch('${matchId}')" title="Delete Match">🗑️</button>
                            </div>
                        </div>
                    `;
                    matchesContainer.appendChild(li);
                });
            } else {
                matchesContainer.innerHTML = '<li style="text-align:center; color:#888; width: 100%;">No matches scheduled yet.</li>';
            }
        } catch (err) {
            matchesContainer.innerHTML = '<li style="text-align:center; color:red; width: 100%;">Error loading matches.</li>';
        }
    }

    window.scheduleMatch = async function() {
        if (!tourId) {
            alert("⚠️ Please select a tournament from the dropdown first!");
            return;
        }
        const team1 = document.getElementById('team1Select').value;
        const team2 = document.getElementById('team2Select').value;
        const overs = document.getElementById('matchOversInput').value || 10;
        const matchType = document.getElementById('matchTypeSelect').value;

        if (!team1 || !team2) {
            alert("⚠️ Please select both teams!");
            return;
        }
        if (team1 === team2) {
            alert("⚠️ Team 1 and Team 2 cannot be the same!");
            return;
        }

        try {
            const newMatchRef = push(ref(db, `users/${currentUserId}/tournaments/${tourId}/matches`));
            await set(newMatchRef, {
                team1: team1,
                team2: team2,
                overs: overs,
                type: matchType.toLowerCase(),
                status: 'scheduled',
                createdAt: Date.now()
            });

            document.getElementById('team1Select').value = "";
            document.getElementById('team2Select').value = "";
            updateTeamDropdowns();
            loadMatchesList();
            alert("📅 Match scheduled successfully!");
        } catch (err) {
            alert("❌ Failed to schedule match.");
        }
    };

    window.launchOrResumeMatch = async function(btnElement, matchId, t1, t2, overs, type) {
        try {
            let originalText = btnElement.innerText;
            btnElement.innerText = "⏳ Loading...";
            btnElement.disabled = true;

            const matchRef = ref(db, `users/${currentUserId}/tournaments/${tourId}/matches/${matchId}`);
            const matchSnap = await get(matchRef);

            let isAlreadyStarted = false;
            if (matchSnap.exists() && matchSnap.val().status === 'running') {
                isAlreadyStarted = true;
            }

            if (!isAlreadyStarted) {
                const userRef = ref(db, `users/${currentUserId}`);
                const userSnap = await get(userRef);

                let currentCredits = 0;
                if (userSnap.exists() && userSnap.val().credits !== undefined) {
                    currentCredits = parseInt(userSnap.val().credits);
                }

                if (currentCredits <= 0) {
                    alert("❌ Insufficient credits! You have 0 credits.");
                    btnElement.innerText = originalText;
                    btnElement.disabled = false;
                    return;
                }

                await update(userRef, { credits: currentCredits - 1 });
                await update(matchRef, { status: 'running' });
                await remove(ref(db, `live_matches/${currentUsername}/score`));
            }

            let targetUrl = `controller.html?t=${tourId}&u=${currentUsername}&m=${matchId}&t1=${encodeURIComponent(t1)}&t2=${encodeURIComponent(t2)}&overs=${overs}&type=${encodeURIComponent(type)}`;
            window.location.href = targetUrl;
            
        } catch (err) {
            alert("❌ Error found: " + err.message); 
            btnElement.innerText = "Try Again";
            btnElement.disabled = false;
        }
    };

    window.deleteMatch = async function(matchId) {
        if (!tourId) return;
        if (!confirm("⚠️ Are you sure you want to delete this match?")) return;
        try {
            await remove(ref(db, `users/${currentUserId}/tournaments/${tourId}/matches/${matchId}`));
            loadMatchesList();
        } catch (err) {
            alert("❌ Failed to delete match.");
        }
    };

    // ফায়ারবেস অথেন্টিকেশন সিকিউরিটি চেক (কন্টেইনার হাইড করা বাদ দিয়ে সরাসরি লোড নিশ্চিত করা হয়েছে)
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            if (!currentUsername) {
                currentUsername = localStorage.getItem('proCricketUsername') || "user";
            }
            initTournamentPanel();
        } else {
            alert("⚠️ Unauthorized access! Please login first.");
            window.location.href = "index.html";
        }
    });
</script>

</body>
</html>
