<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Points Table</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .header-title { font-family: 'Oswald', sans-serif; color: #1e3c72; font-size: 22px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        .select-box { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-weight: bold; color: #334155; background: #f8fafc; margin-bottom: 15px; cursor: pointer; }
        #tournamentSelector { border-color: #007bff; background: #eef2ff; color: #1e3c72; }

        .points-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }
        .points-table th { background: #007bff; color: #fff; font-family: 'Oswald', sans-serif; font-weight: 500; padding: 10px 8px; letter-spacing: 0.5px; font-size: 13px; }
        .points-table th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; text-align: left; padding-left: 12px; }
        .points-table th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        
        .points-table td { padding: 10px 8px; border-bottom: 1px solid #f1f5f9; color: #1e293b; vertical-align: middle; }
        .points-table tr:hover { background: #f8fafc; }

        .team-name { text-align: left; font-weight: bold; color: #0f172a; padding-left: 12px; font-size: 14px; }
        .pts-bold { font-weight: bold; color: #16a34a; font-size: 15px; }
        .loading-text { text-align: center; color: #64748b; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <span id="tourTitle">📊 Points Table</span>
    </div>

    <select id="tournamentSelector" class="select-box" onchange="window.changeTournament()">
        <option value="">⏳ Loading Tournaments...</option>
    </select>

    <div style="overflow-x: auto;">
        <table class="points-table">
            <thead>
                <tr>
                    <th style="text-align: left;">Team Name</th>
                    <th>P</th>
                    <th>W</th>
                    <th>L</th>
                    <th>Pts</th>
                    <th>NRR</th>
                </tr>
            </thead>
            <tbody id="pointsTableBody">
                <tr><td colspan="6" class="loading-text">Please select a tournament from above.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
      authDomain: "cricket-score-d187a.firebaseapp.com",
      databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
      projectId: "cricket-score-d187a",
      storageBucket: "cricket-score-d187a.firebasestorage.app",
      messagingSenderId: "782741896785",
      appId: "1:782741896785:android:ca8c45a9120f7784928270"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let currentUserId = "";
    let activeTournamentId = urlParams.get('t') || localStorage.getItem('activeTournamentId');

    window.changeTournament = function() {
        const selector = document.getElementById('tournamentSelector');
        if (!selector) return;
        
        activeTournamentId = selector.value;
        
        if (activeTournamentId) {
            localStorage.setItem('activeTournamentId', activeTournamentId);
            if (selector.options[selector.selectedIndex]) {
                document.getElementById('tourTitle').innerText = "📊 " + selector.options[selector.selectedIndex].text;
            }
            
            try {
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('t', activeTournamentId);
                window.history.pushState({}, '', newUrl);
            } catch(err) {
                console.error("History push state error:", err);
            }
        } else {
            document.getElementById('tourTitle').innerText = "📊 Points Table";
            try {
                const newUrl = new URL(window.location);
                newUrl.searchParams.delete('t');
                window.history.pushState({}, '', newUrl);
            } catch(err) {
                console.error("History delete state error:", err);
            }
        }
        
        loadPointsTable();
    }

    async function loadPointsTable() {
        const tbody = document.getElementById('pointsTableBody');
        if (!tbody) return;
        
        if (!activeTournamentId) {
            tbody.innerHTML = `<tr><td colspan="6" class="loading-text">Please select a tournament from above.</td></tr>`;
            return;
        }

        if (!currentUserId) {
            return; // ইউজার আইডি না থাকলে অপেক্ষা করবে
        }

        tbody.innerHTML = `<tr><td colspan="6" class="loading-text">Loading points table...</td></tr>`;

        try {
            // সঠিক পাথ: যেখানে আপনার টুর্নামেন্ট ও দলগুলো সেভ করা আছে
            const pointsRef = ref(db, `users/${currentUserId}/tournaments/${activeTournamentId}/teams/`);
            let snap = await get(pointsRef);
            
            if (!snap.exists()) {
                tbody.innerHTML = `<tr><td colspan="6" class="loading-text" style="color:#dc3545;">No teams registered in this tournament yet!</td></tr>`;
                return;
            }

            let teamsData = snap.val() || {};
            let teamsArray = Object.keys(teamsData)
                .map(key => {
                    let item = teamsData[key];
                    // যদি ডেটা অবজেক্ট না হয়ে সরাসরি স্ট্রিং বা অন্য কিছু হয়, তবে নাম সেট করে নেওয়া
                    if (typeof item === 'string') {
                        return { name: item, matchesPlayed: 0, won: 0, lost: 0, points: 0, netRunRate: '+0.000' };
                    }
                    return item;
                })
                .filter(item => item !== null && (typeof item === 'object'));

            if (teamsArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="loading-text" style="color:#dc3545;">No teams registered in this tournament yet!</td></tr>`;
                return;
            }

            teamsArray.sort((a, b) => {
                let ptsA = Number(a.points) || 0;
                let ptsB = Number(b.points) || 0;
                let nrrA = parseFloat(a.netRunRate) || 0;
                let nrrB = parseFloat(b.netRunRate) || 0;

                return ptsB - ptsA || nrrB - nrrA;
            });

            tbody.innerHTML = "";
            teamsArray.forEach((team, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="team-name">${index + 1}. ${team.name || "Unknown Team"}</td>
                    <td>${team.matchesPlayed || 0}</td>
                    <td>${team.won || 0}</td>
                    <td>${team.lost || 0}</td>
                    <td class="pts-bold">${team.points || 0}</td>
                    <td>${team.netRunRate || '+0.000'}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error("Points table load error:", e);
            tbody.innerHTML = `<tr><td colspan="6" class="loading-text" style="color:#dc3545;">Failed to load points table</td></tr>`;
        }
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            
            try {
                const toursSnap = await get(ref(db, `users/${currentUserId}/tournaments/`));
                const selector = document.getElementById('tournamentSelector');
                if (!selector) return;
                
                if (toursSnap.exists()) {
                    const toursData = toursSnap.val();
                    selector.innerHTML = '<option value="">-- Select a Tournament --</option>';
                    
                    for (let tId in toursData) {
                        if (toursData[tId]) {
                            let opt = document.createElement('option');
                            opt.value = tId;
                            opt.textContent = toursData[tId].name || "Unnamed Tournament";
                            
                            if (tId === activeTournamentId) {
                                opt.selected = true;
                                document.getElementById('tourTitle').innerText = "📊 " + opt.textContent;
                            }
                            selector.appendChild(opt);
                        }
                    }
                    
                    if (!activeTournamentId && selector.options.length > 1) {
                        selector.selectedIndex = 1;
                        window.changeTournament(); 
                    } else if (activeTournamentId) {
                        loadPointsTable();
                    }
                } else {
                    selector.innerHTML = '<option value="">No Tournaments Found</option>';
                    const tbodyElem = document.getElementById('pointsTableBody');
                    if (tbodyElem) {
                        tbodyElem.innerHTML = `<tr><td colspan="6" class="loading-text">No tournaments available.</td></tr>`;
                    }
                }
            } catch(e) {
                console.error("Error fetching tournaments:", e);
                const selectorElem = document.getElementById('tournamentSelector');
                if (selectorElem) {
                    selectorElem.innerHTML = '<option value="">Error loading tournaments</option>';
                }
            }
        } else {
            alert("Please login first.");
            window.location.href = "index.html";
        }
    });
</script>

</body>
</html>
