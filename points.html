<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Points Table</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #f1f1f1; padding-bottom: 15px; }
        h2 { color: #0056b3; margin: 0; font-size: 22px; }
        
        /* Dropdown Styling */
        .select-box { width: 100%; padding: 10px 12px; border: 1px solid #007bff; border-radius: 8px; font-size: 14px; font-weight: bold; color: #1e3c72; background: #eef2ff; margin-bottom: 20px; cursor: pointer; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
        th, td { padding: 14px 12px; text-align: center; border-bottom: 1px solid #e9ecef; font-size: 15px; }
        th { background: #007bff; color: white; font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
        tr:hover { background: #f8f9fa; }
        .team-name { text-align: left; font-weight: bold; color: #333; }
        .pts-bold { font-weight: bold; color: #28a745; font-size: 16px; }
        .loading-text { text-align: center; color: #666; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h2 id="tourTitle">📊 Points Table</h2>
    </div>
    
    <!-- Tournament Dropdown -->
    <select id="tournamentSelector" class="select-box" onchange="changeTournament()">
        <option value="">⏳ Loading Tournaments...</option>
    </select>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left;">Team Name</th>
                    <th>P</th>
                    <th>W</th>
                    <th>L</th>
                    <th>Pts</th>
                    <th>NRR</th>
                </tr>
            </thead>
            <tbody id="pointsTableBody">
                <tr><td colspan="6" class="loading-text">Please select a tournament to view points table.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Firebase Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
      authDomain: "cricket-score-d187a.firebaseapp.com",
      databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
      projectId: "cricket-score-d187a",
      storageBucket: "cricket-score-d187a.firebasestorage.app",
      messagingSenderId: "782741896785",
      appId: "1:782741896785:android:ca8c45a9120f7784928270"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let currentMatchUser = urlParams.get('u') || localStorage.getItem('proCricketUsername');
    let currentUserId = "";
    let tourId = urlParams.get('t');

    // ড্রপডাউন থেকে টুর্নামেন্ট পরিবর্তনের ফাংশন
    window.changeTournament = function() {
        const selector = document.getElementById('tournamentSelector');
        tourId = selector.value;
        
        if (tourId) {
            document.getElementById('tourTitle').innerText = "📊 " + selector.options[selector.selectedIndex].text;
            
            // URL আপডেট করা যাতে রিলোড দিলে আইডি হারিয়ে না যায়
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('t', tourId);
            window.history.pushState({}, '', newUrl);
        } else {
            document.getElementById('tourTitle').innerText = "📊 Points Table";
            const newUrl = new URL(window.location);
            newUrl.searchParams.delete('t');
            window.history.pushState({}, '', newUrl);
        }
        
        loadPointsTable();
    }

    // পয়েন্ট টেবিল লোড করার ফাংশন (লিডারবোর্ডের ঠিক একই ডেটা সোর্স ব্যবহার করে)
    async function loadPointsTable() {
        const tableBody = document.getElementById('pointsTableBody');

        if (!tourId || tourId === 'null' || tourId === '') {
            tableBody.innerHTML = `<tr><td colspan="6" class="loading-text" style="color:#666;">Please select a tournament from above to view the points table.</td></tr>`;
            return;
        }

        tableBody.innerHTML = `<tr><td colspan="6" class="loading-text">Loading points table...</td></tr>`;

        try {
            // লিডারবোর্ডের মতোই সঠিক পাথ থেকে টিমের পয়েন্ট ডেটা ফেচ করা হচ্ছে
            const pointsRef = ref(db, `live_matches/${currentMatchUser}/tournaments_data/${tourId}/teams`);
            const snapshot = await get(pointsRef);
            
            if (!snapshot.exists()) {
                tableBody.innerHTML = `<tr><td colspan="6" style="color:#888; padding: 20px;">No teams added yet for this tournament.</td></tr>`;
                return;
            }

            let teamsData = snapshot.val();
            tableBody.innerHTML = "";
            let teamsArray = Object.keys(teamsData).map(key => teamsData[key]);

            // পয়েন্ট এবং নেট রানরেটের ভিত্তিতে দলগুলোকে সাজানো (Sorting)
            teamsArray.sort((a, b) => (b.points || 0) - (a.points || 0) || parseFloat(b.netRunRate || 0) - parseFloat(a.netRunRate || 0));

            teamsArray.forEach((team, index) => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td class="team-name">${index + 1}. ${team.name || 'Team'}</td>
                    <td>${team.matchesPlayed || 0}</td>
                    <td>${team.won || 0}</td>
                    <td>${team.lost || 0}</td>
                    <td class="pts-bold">${team.points || 0}</td>
                    <td>${team.netRunRate || '+0.000'}</td>
                `;
                tableBody.appendChild(row);
            });
        } catch (error) {
            console.error("Error loading points:", error);
            tableBody.innerHTML = `<tr><td colspan="6" style="color:red; padding: 20px;">Failed to load points table. Check console.</td></tr>`;
        }
    }

    // অথেন্টিকেশন এবং টুর্নামেন্ট লিস্ট লোড করার অংশ (লিডারবোর্ডের হুবহু লজিক)
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            if (!currentMatchUser) {
                currentMatchUser = localStorage.getItem('proCricketUsername') || "user";
            }
            
            try {
                const toursSnap = await get(ref(db, `users/${currentUserId}/tournaments/`));
                const selector = document.getElementById('tournamentSelector');
                
                if (toursSnap.exists()) {
                    const toursData = toursSnap.val();
                    selector.innerHTML = '<option value="">-- Select a Tournament --</option>';
                    
                    for (let tId in toursData) {
                        let opt = document.createElement('option');
                        opt.value = tId;
                        opt.textContent = toursData[tId].name || "Unnamed Tournament";
                        
                        if (tId === tourId) {
                            opt.selected = true;
                            document.getElementById('tourTitle').innerText = "📊 " + opt.textContent;
                        }
                        selector.appendChild(opt);
                    }
                    
                    // যদি ইউআরএলে টুর্নামেন্ট আইডি না থাকে কিন্তু ড্রপডাউনে টুর্নামেন্ট থাকে
                    if (!tourId && selector.options.length > 1) {
                        selector.selectedIndex = 1;
                        tourId = selector.value;
                        document.getElementById('tourTitle').innerText = "📊 " + selector.options[selector.selectedIndex].text;
                    }
                } else {
                    selector.innerHTML = '<option value="">No Tournaments Found</option>';
                }
            } catch(e) {
                console.error("Error fetching tournaments:", e);
                document.getElementById('tournamentSelector').innerHTML = '<option value="">Error loading tournaments</option>';
            }
            
            loadPointsTable();
        } else {
            alert("⚠️ Please login first.");
            window.location.href = "index.html";
        }
    });

</script>
</body>
</html>
