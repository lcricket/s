<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        
        .btn-dash-link { background: #0056b3; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-dash-link:hover { background: #004085; }

        h2 { color: #333; margin: 0; font-family: 'Oswald', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
        
        /* প্রোফাইল কার্ড স্টাইল */
        .profile-card { display: flex; align-items: center; gap: 20px; background: #e8f4fd; border: 1px solid #b8daff; padding: 20px; border-radius: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: #ccc; object-fit: cover; border: 3px solid #0056b3; flex-shrink: 0; }
        .profile-details { flex: 1; }
        .profile-details h3 { margin: 0 0 5px 0; color: #0056b3; font-size: 22px; word-break: break-word; }
        .profile-details p { margin: 0; color: #555; font-size: 14px; }

        .box { background: #f9f9f9; padding: 18px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        
        /* ক্রেডিট বক্স স্টাইল */
        .credit-box { 
            background: #e8f5e9;
            padding: 12px;
            border-radius: 8px;
            font-size: 17px; 
            font-weight: bold; 
            color: #2e7d32; 
            margin-bottom: 15px; 
            border: 1px solid #c8e6c9;
            text-align: center;
        }

        .link-box { 
            background: #f8f9fa; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            border: 1px dashed #ced4da;
            text-align: left;
        }
        .link-input-group { display: flex; gap: 8px; margin-top: 6px; }
        .link-input-group input {
            width: 100%;
            margin: 0;
            padding: 8px 10px;
            font-size: 13px;
            background: #ffffff;
            cursor: pointer;
            color: #007bff;
            font-weight: 500;
            border: 1px solid #ced4da;
            border-radius: 6px;
        }
        .btn-copy { 
            background-color: #17a2b8; 
            padding: 8px 14px; 
            font-size: 14px; 
            margin: 0; 
            width: auto; 
            white-space: nowrap;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* স্ট্যাটস গ্রিড */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
        @media(max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-card { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .stat-card span { font-size: 13px; color: #666; display: block; margin-bottom: 5px; }
        .stat-card strong { font-size: 20px; color: #0056b3; }
    </style>
</head>
<body>

<div class="container">

    <!-- হেডার -->
    <div style="border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px;">
        <h2>Profile</h2>
    </div>

    <!-- প্রোফাইল কার্ড -->
    <div class="profile-card">
        <img id="displayAvatar" src="https://via.placeholder.com/90" alt="Avatar" class="profile-avatar">
        <div class="profile-details">
            <h3 id="displayName">Loading User...</h3> 
        </div>
        <button class="btn-dash-link" style="background: #28a745; padding: 8px 14px;" onclick="window.toggleEditMode()">✏️ Edit Profile</button>
    </div>

    <!-- ক্যামেরা লাইভ ও OBS লিংক বক্স (নতুন যোগ করা হয়েছে) -->
    <div class="link-box">
        <b style="font-size: 13px; color: #333;">Copy this Link for CameraFi LIVE & OBS Studio:</b>
        <div class="link-input-group">
            <input type="text" id="viewer-link-input" readonly onclick="this.select()" placeholder="Generating link...">
            <button class="btn-copy" onclick="copyLink()">📋 Copy</button>
        </div>
    </div>

    <!-- প্রোফাইল এডিট ফর্ম -->
    <div class="box" id="profileEditBox" style="display: none;">
        <h3>✏️ Edit Profile Details</h3>
        
        <label style="font-weight: bold; font-size: 14px; color: #444;">Your Name</label>
        <input type="text" id="inputProfileName" placeholder="Enter your full name" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px;">
        
        <label style="font-weight: bold; font-size: 14px; color: #444; margin-top: 10px; display: block;">Username (Lowercase letters & numbers only)</label>
        <input type="text" id="inputProfileUsername" placeholder="Enter new username" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px;" maxlength="15">

        <label style="font-weight: bold; display: block; margin-top: 10px; font-size: 14px; color: #444;">Profile Picture (Choose from Gallery)</label>
        <input type="file" id="inputProfileFile" accept="image/*" style="width: 100%; padding: 8px; margin-top: 5px; background: #fff; border: 1px solid #ccc; border-radius: 6px;">
        
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-dash-link" style="background: #0056b3; width: 100%; justify-content: center; padding: 10px;" onclick="window.saveUserProfile()">Save Changes</button>
            <button class="btn-dash-link" style="background: #6c757d; width: 100%; justify-content: center; padding: 10px;" onclick="window.toggleEditMode()">Cancel</button>
        </div>
    </div>

    <!-- ক্রিকেট ক্যারিয়ার পারফরম্যান্স সেকশন -->
    <div class="box">
        <h3 style="color: #0056b3; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-top: 0;">🏏 Cricket Career Performance</h3>
        <div class="stats-grid">
            <div class="stat-card">
                <span>Matches Played</span>
                <strong id="statMatches">0</strong>
            </div>
            <div class="stat-card">
                <span>Total Runs</span>
                <strong id="statRuns" style="color: #28a745;">0</strong>
            </div>
            <div class="stat-card">
                <span>Total Wickets</span>
                <strong id="statWickets" style="color: #dc3545;">0</strong>
            </div>
            <div class="stat-card">
                <span>Total Fours (4s)</span>
                <strong id="statFours">0</strong>
            </div>
            <div class="stat-card">
                <span>Total Sixes (6s)</span>
                <strong id="statSixes">0</strong>
            </div>
            <div class="stat-card">
                <span>Man of the Match</span>
                <strong id="statMOM" style="color: #f39c12;">0</strong>
            </div>
        </div>
    </div>

</div>

<!-- Firebase Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getDatabase, ref, get, update, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
      authDomain: "cricket-score-d187a.firebaseapp.com",
      databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
      projectId: "cricket-score-d187a",
      storageBucket: "cricket-score-d187a.firebasestorage.app",
      messagingSenderId: "782741896785",
      appId: "1:782741896785:android:ca8c45a9120f7784928270"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUserId = "";
    let currentUsername = localStorage.getItem('proCricketUsername') || "";
    let selectedImageBase64 = "";

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            
            const userRef = ref(db, `users/${currentUserId}`);
            
            onValue(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    if (userData.username) {
                        currentUsername = userData.username;
                        localStorage.setItem('proCricketUsername', currentUsername);
                    }
                    const credits = userData.credits !== undefined ? userData.credits : 0;
                    document.getElementById('user-credits').innerText = credits;
                    
                    // ড্যাশবোর্ড বা প্রোফাইল পেজে লিংকটি সরাসরি আপডেট করার জন্য
                    const linkInput = document.getElementById('viewer-link-input');
                    if (linkInput && currentUsername) {
                        linkInput.value = `https://lcricket.github.io/s/viewer.html?u=${currentUsername}`;
                    }
                }
            });

            loadProfileData(currentUserId);
            loadCareerStats();
        } else {
            alert("⚠️ Please login from dashboard first.");
            window.location.href = "index.html";
        }
    });

    window.copyLink = () => {
        const inputField = document.getElementById('viewer-link-input');
        if (!inputField.value) return alert("No link available!");
        inputField.select();
        inputField.setSelectionRange(0, 99999);
        document.execCommand('copy');
        alert("Viewer link copied!");
    };

    function loadProfileData(userId) {
        const profileRef = ref(db, `users/${userId}/profile`);
        onValue(profileRef, (profileSnap) => {
            if (profileSnap.exists()) {
                const data = profileSnap.val();
                document.getElementById('displayName').innerText = data.name || currentUsername || "User";
                if (data.photo && data.photo.trim() !== "") {
                    document.getElementById('displayAvatar').src = data.photo;
                }
            } else {
                set(profileRef, {
                    name: currentUsername || "User",
                    photo: ""
                });
                document.getElementById('displayName').innerText = currentUsername || "User";
            }
        });
    }

    async function loadCareerStats() {
        try {
            if (!currentUsername) return;
            const tournamentsSnap = await get(ref(db, `live_matches/${currentUsername}/tournaments_data/`));
            let tMatches = 0, tRuns = 0, tWickets = 0, tFours = 0, tSixes = 0, tMOM = 0;

            if (tournamentsSnap.exists()) {
                const tournaments = tournamentsSnap.val();
                Object.keys(tournaments).forEach(tourId => {
                    const tourData = tournaments[tourId];
                    if (tourData && tourData.players) {
                        const myStats = tourData.players[document.getElementById('displayName').innerText] || tourData.players[currentUsername];
                        if (myStats) {
                            tMatches += (myStats.matchesPlayed || 0);
                            tRuns += (myStats.runs || 0);
                            tWickets += (myStats.wickets || 0);
                            tFours += (myStats.fours || 0);
                            tSixes += (myStats.sixes || 0);
                            tMOM += (myStats.mom || 0);
                        }
                    }
                });
            }

            document.getElementById('statMatches').innerText = tMatches;
            document.getElementById('statRuns').innerText = tRuns;
            document.getElementById('statWickets').innerText = tWickets;
            document.getElementById('statFours').innerText = tFours;
            document.getElementById('statSixes').innerText = tSixes;
            document.getElementById('statMOM').innerText = tMOM;
        } catch (err) {
            console.error("Error loading career stats:", err);
        }
    }

    window.toggleEditMode = function() {
        const box = document.getElementById('profileEditBox');
        if (box.style.display === 'none') {
            box.style.display = 'block';
            document.getElementById('inputProfileName').value = document.getElementById('displayName').innerText;
            document.getElementById('inputProfileUsername').value = currentUsername; 
            selectedImageBase64 = "";
        } else {
            box.style.display = 'none';
        }
    };

    document.getElementById('inputProfileFile').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 200;
                    const MAX_HEIGHT = 200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                };
            };
            reader.readAsDataURL(file);
        }
    });

    window.saveUserProfile = async function() {
        const newName = document.getElementById('inputProfileName').value.trim();
        const newUsername = document.getElementById('inputProfileUsername').value.trim().toLowerCase();

        if (!newName || !newUsername) {
            alert("⚠️ Name and Username cannot be empty!");
            return;
        }

        if (!/^[a-z0-9]+$/.test(newUsername)) {
            alert("⚠️ Username must contain only lowercase letters and numbers.");
            return;
        }

        try {
            if (newUsername !== currentUsername) {
                const usernameRef = ref(db, 'usernames/' + newUsername);
                const snapshot = await get(usernameRef);
                if (snapshot.exists()) {
                    alert("❌ Username already taken! Choose another.");
                    return;
                }

                // নতুন ইউজারনেম ডাটাবেজে সেট এবং পুরনোটি রিমুভ করা
                await set(ref(db, 'usernames/' + newUsername), currentUserId);
                await remove(ref(db, 'usernames/' + currentUsername));
                
                // মূল ইউজার নোডে ইউজারনেম আপডেট করা
                await update(ref(db, `users/${currentUserId}`), { username: newUsername });
                
                currentUsername = newUsername;
                localStorage.setItem('proCricketUsername', currentUsername);
            }

            let updateData = { name: newName };
            if (selectedImageBase64) {
                updateData.photo = selectedImageBase64;
            }

            await update(ref(db, `users/${currentUserId}/profile`), updateData);
            alert("✅ Profile updated successfully!");
            window.toggleEditMode();
            window.location.reload(); // পেজ রিফ্রেশ করে নতুন ইউজারনেম ও লিংক আপডেট নিশ্চিত করা
        } catch (err) {
            console.error("Error updating profile:", err);
            alert("❌ Failed to update profile.");
        }
    };
</script>

</body>
</html>
