<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Matches</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white p-4">

    <div class="max-w-md mx-auto">
        <h2 class="text-xl font-bold mb-4 text-amber-400 border-b border-slate-800 pb-2">Ongoing live matches</h2>
        
        <div id="match-list-container" class="space-y-3">
            <p class="text-slate-400 text-sm">Match is loading...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
            authDomain: "cricket-score-d187a.firebaseapp.com",
            databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
            projectId: "cricket-score-d187a",
            storageBucket: "cricket-score-d187a.firebasestorage.app",
            messagingSenderId: "782741896785",
            appId: "1:782741896785:android:ca8c45a9120f7784928270"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const container = document.getElementById('match-list-container');

        function renderLiveMatches(liveItems) {
            container.innerHTML = "";
            if (!liveItems.length) {
                container.innerHTML = `<p class="text-slate-500 text-sm">No live matches at the moment.</p>`;
                return;
            }

            liveItems.forEach(({ tourId, matchId, match }) => {
                const status = (match.status || "").toString().toLowerCase();
                if (status !== "running" && status !== "live") return;

                const t1 = match.team1 || match.team1Name || "Team 1";
                const t2 = match.team2 || match.team2Name || "Team 2";
                const runs = match.runs ?? match.score ?? 0;
                const wickets = match.wickets ?? 0;
                const overs = match.overs ?? "0.0";

                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg cursor-pointer hover:border-amber-400 transition";
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-emerald-400 font-semibold mb-2">
                        <span class="bg-emerald-950 px-2.5 py-0.5 rounded-full border border-emerald-800">LIVE</span>
                        <span class="text-slate-400">Overs: ${overs}</span>
                    </div>
                    <div class="flex justify-between items-center text-base font-bold">
                        <span>${t1} vs ${t2}</span>
                        <span class="text-amber-400">${runs}-${wickets}</span>
                    </div>
                `;

                card.onclick = () => {
                    const params = new URLSearchParams({
                        matchId: matchId,
                        t: tourId || "",
                        t1: t1,
                        t2: t2,
                        overs: match.overs || 10
                    });
                    window.location.href = `live-score.html?${params.toString()}`;
                };

                container.appendChild(card);
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                container.innerHTML = `<p class="text-amber-400 text-sm">Please login to view live matches.</p>`;
                return;
            }

            const userToursRef = ref(db, `users/${user.uid}/tournaments`);
            onValue(userToursRef, (snapshot) => {
                const tours = snapshot.val();
                const liveItems = [];

                if (tours) {
                    Object.keys(tours).forEach(tourId => {
                        const matches = tours[tourId]?.matches;
                        if (matches) {
                            Object.keys(matches).forEach(matchId => {
                                const m = matches[matchId];
                                const st = (m.status || "").toString().toLowerCase();
                                if (st === "running" || st === "live") {
                                    liveItems.push({ tourId, matchId, match: m });
                                }
                            });
                        }
                    });
                }

                renderLiveMatches(liveItems);
            }, (error) => {
                console.error(error);
                container.innerHTML = `<p class="text-rose-400 text-sm">Error loading live matches.</p>`;
            });
        });
    </script>
</body>
</html>
