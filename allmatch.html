<!DOCTYPE html>
<html lang="bn">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }

        /* ================= সাইড মেনু (Drawer) CSS ================= */
        .overlay {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: rgba(0, 0, 0, 0.5) !important;
            display: none;
            z-index: 1001 !important;
        }

        .overlay.show {
            display: block !important;
        }

        .side-drawer {
            position: fixed !important;
            top: 0 !important;
            left: -295px !important;
            width: 285px !important;
            height: 100vh !important;
            background-color: #ffffff !important;
            color: #050505 !important;
            z-index: 1002 !important;
            transition: left 0.3s ease !important;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.25) !important;
            display: flex !important;
            flex-direction: column !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .side-drawer.open {
            left: 0 !important;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid #e4e6eb;
            background-color: #f8f9fa;
        }

        .drawer-header h3 {
            font-size: 17px;
            color: #050505;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .close-drawer {
            background: #e4e6eb;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            color: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawer-links {
            list-style: none;
            padding: 10px;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .drawer-links li {
            margin-bottom: 4px;
        }

        .drawer-links a,
        .drawer-links .drawer-version-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            text-decoration: none;
            color: #050505;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .drawer-item-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .drawer-links a:hover {
            background-color: #f0f2f5;
            color: #0866ff;
        }

        .drawer-links i {
            width: 22px;
            text-align: center;
            font-size: 17px;
        }

        .version-badge-text {
            font-size: 12px;
            font-weight: 700;
            color: #0866ff;
            background: #e7f3ff;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* ================= সব পেজের জন্য সমান হেডার ================= */
        .fb-header-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 42px;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            z-index: 1000;
            font-family: 'Poppins', sans-serif;
            text-transform: none;
            box-sizing: border-box;
        }

        .fb-menu-btn {
            height: 42px;
            width: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: #1c1e21;
            font-size: 17px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .fb-nav-tabs {
            display: flex;
            width: 100%;
            height: 42px;
            max-width: 900px;
            margin: 0 auto;
            padding: 0;
            align-items: center;
            box-sizing: border-box;
        }

        .fb-tab-btn {
            flex: 1 1 0;
            width: 0;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #65676b;
            font-size: 18px;
            line-height: 1;
            padding: 0;
            margin: 0;
            border: none;
            border-bottom: 3px solid transparent;
            background: transparent;
            box-sizing: border-box;
            overflow: hidden;
        }

        .fb-tab-btn:hover,
        .fb-tab-btn.active {
            color: #1877f2;
            border-bottom-color: #1877f2;
        }
        /* ============================================================ */
    </style>
</head>
<body class="bg-slate-950 text-white p-4 pt-14">

    <!-- ================= ফেসবুক স্টাইল হেডার শুরু ================= -->
    <header class="fb-header-wrapper">
        <nav class="fb-nav-tabs">
            <!-- সাইড মেনু ট্রিগার বাটন -->
            <button type="button" class="fb-menu-btn" onclick="toggleDrawer()" aria-label="Menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Home লোগো -->
            <a href="https://lcricket.github.io/s/feed.html" class="fb-tab-btn active" title="Home">🏠</a>

            <!-- Tournament লোগো -->
            <a href="https://lcricket.github.io/s/match.html" class="fb-tab-btn" title="Tournament">🏆</a>

            <!-- Match লোগো -->
            <a href="https://lcricket.github.io/s/tournament_panel.html" class="fb-tab-btn" title="Match">🏏</a>

            <!-- Controller লোগো -->
            <a href="https://lcricket.github.io/s/controller.html" class="fb-tab-btn" title="Controller">🎛️</a>

            <!-- Live লোগো -->
            <a href="https://lcricket.github.io/s/allmatch.html" class="fb-tab-btn" title="Live Match">📡</a>

            <!-- Profile লোগো -->
            <a href="https://lcricket.github.io/s/profile.html" class="fb-tab-btn" title="Profile">👤</a>
        </nav>
    </header>

    <!-- ================= সাইড মেনু বার (৯টি অপশন ও লোগোসহ) ================= -->
    <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

    <aside class="side-drawer" id="sideDrawer">
        <div class="drawer-header">
            <h3><i class="fa-solid fa-baseball-bat-ball" style="color: #0866ff;"></i> Local Cricket Live</h3>
            <button type="button" class="close-drawer" onclick="toggleDrawer()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <ul class="drawer-links">
            <!-- ১. Login -->
            <li>
                <a href="https://lcricket.github.io/s/index.html">
                    <span class="drawer-item-left"><i class="fa-solid fa-shield-halved" style="color: #0866ff;"></i> Login</span>
                </a>
            </li>
            <!-- ২. Profile -->
            <li>
                <a href="https://lcricket.github.io/s/profile.html">
                    <span class="drawer-item-left"><i class="fa-solid fa-user" style="color: #1c1e21;"></i> Profile</span>
                </a>
            </li>
            <!-- ৩. Share -->
            <li>
                <a href="https://play.google.com/store/apps/details?id=com.localcricket" onclick="shareApp(event)">
                    <span class="drawer-item-left"><i class="fa-solid fa-share-nodes" style="color: #0866ff;"></i> Share</span>
                </a>
            </li>
            <!-- ৪. More Apps -->
            <li>
                <a href="https://play.google.com/store/apps/dev?id=6590894441433938633" target="_blank" rel="noopener noreferrer">
                    <span class="drawer-item-left"><i class="fa-solid fa-border-all" style="color: #42b72a;"></i> More Apps</span>
                </a>
            </li>
            <!-- ৫. Contact Whatsapp -->
            <li>
                <a href="https://wa.me/918327321495?text=Hello%20Local%20Cricket%20Live%20Support%2C%20I%20need%20help." target="_blank" rel="noopener noreferrer">
                    <span class="drawer-item-left"><i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> Contact Whatsapp</span>
                </a>
            </li>
            <!-- ৬. Support -->
            <li>
                <a href="https://www.facebook.com/kolkatasports0" target="_blank" rel="noopener noreferrer">
                    <span class="drawer-item-left"><i class="fa-solid fa-headset" style="color: #e67e22;"></i> Support</span>
                </a>
            </li>
            <!-- ৭. privacy Policy -->
            <li>
                <a href="https://doc-hosting.flycricket.io/cricket-live-with-scoreboard-privacy-policy/190919ed-e06d-4196-bae2-d63052765d2d/privacy" target="_blank" rel="noopener noreferrer">
                    <span class="drawer-item-left"><i class="fa-solid fa-file-shield" style="color: #6c5ce7;"></i> privacy Policy</span>
                </a>
            </li>
            <!-- ৮. Apk Rare -->
            <li>
                <a href="https://play.google.com/store/apps/details?id=com.localcricket" target="_blank" rel="noopener noreferrer">
                    <span class="drawer-item-left"><i class="fa-solid fa-android" style="color: #3ddc84;"></i> Apk Rare</span>
                </a>
            </li>
            <!-- ৯. App Version -->
            <li>
                <div class="drawer-version-item">
                    <span class="drawer-item-left"><i class="fa-solid fa-code-branch" style="color: #0866ff;"></i> App Version</span>
                    <span class="version-badge-text" id="app-version-display">v1.8</span>
                </div>
            </li>
        </ul>
    </aside>

    <script>
        const APP_VERSION = "v1.8";
        const versionEl = document.getElementById('app-version-display');
        if (versionEl) versionEl.innerText = APP_VERSION;

        function toggleDrawer() {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('overlay');
            if (drawer && overlay) {
                drawer.classList.toggle('open');
                overlay.classList.toggle('show');
            }
        }

        function shareApp(event) {
            const shareUrl = event.currentTarget.getAttribute('href');
            if (navigator.share) {
                event.preventDefault();
                navigator.share({
                    title: 'Local Cricket Live Scoreboard',
                    text: 'Download Local Cricket Live Scoreboard App:',
                    url: shareUrl
                }).catch(() => {
                    window.open(shareUrl, '_blank');
                });
            }
        }
    </script>

    <div id="main-container" class="max-w-md mx-auto">
        <h2 class="text-xl font-bold mb-4 text-amber-400 border-b border-slate-800 pb-2">Ongoing live matches</h2>

        <!-- লাইভ ম্যাচের তালিকা এখানে লোড হবে -->
        <div id="match-list-container" class="space-y-3">
            <p class="text-slate-400 text-sm">Match is loading...</p>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
            authDomain: "cricket-score-d187a.firebaseapp.com",
            databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
            projectId: "cricket-score-d187a",
            storageBucket: "cricket-score-d187a.firebasestorage.app",
            messagingSenderId: "782741896785",
            appId: "1:782741896785:android:ca8c45a9120f7784928270"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const container = document.getElementById('match-list-container');

        const urlParams = new URLSearchParams(window.location.search);
        let latestLiveScore = null;
        let latestTourMatches = null;
        let unsubscribeScore = null;
        let unsubscribeTours = null;

        function resolveScoreUserName() {
            const rawUser = (urlParams.get('u') || localStorage.getItem('proCricketUsername') || "").trim();
            if (!rawUser || rawUser.toLowerCase() === "user" || rawUser.toLowerCase() === "cricketer") {
                return "cricketer";
            }
            return rawUser;
        }

        function renderLiveMatches(targetUser) {
            container.innerHTML = "";
            const cards = [];

            if (latestTourMatches) {
                Object.keys(latestTourMatches).forEach(tourId => {
                    const matches = latestTourMatches[tourId]?.matches;
                    if (matches) {
                        Object.keys(matches).forEach(matchId => {
                            const m = matches[matchId];
                            const st = (m.status || "").toString().toLowerCase();
                            if (st === "running" || st === "live") {
                                const isSameMatch = latestLiveScore &&
                                    !latestLiveScore.matchEnded &&
                                    latestLiveScore.batTeamName &&
                                    (latestLiveScore.batTeamName === m.team1 ||
                                     latestLiveScore.batTeamName === m.team2 ||
                                     latestLiveScore.bowlTeamName === m.team1 ||
                                     latestLiveScore.bowlTeamName === m.team2);

                                cards.push({
                                    tourId,
                                    matchId,
                                    t1: isSameMatch ? (latestLiveScore.batTeamName || m.team1) : (m.team1 || "Team 1"),
                                    t2: isSameMatch ? (latestLiveScore.bowlTeamName || m.team2) : (m.team2 || "Team 2"),
                                    runs: isSameMatch ? (latestLiveScore.runs ?? 0) : (m.runs ?? 0),
                                    wickets: isSameMatch ? (latestLiveScore.wickets ?? 0) : (m.wickets ?? 0),
                                    overs: isSameMatch ? (latestLiveScore.overs ?? "0.0") : (m.overs ?? "0.0")
                                });
                            }
                        });
                    }
                });
            }

            if (cards.length === 0 && latestLiveScore && latestLiveScore.batTeamName && !latestLiveScore.matchEnded) {
                cards.push({
                    tourId: latestLiveScore.tournamentId || localStorage.getItem("activeTournamentId") || "",
                    matchId: localStorage.getItem("activeMatchId") || "default_match",
                    t1: latestLiveScore.batTeamName || "Team 1",
                    t2: latestLiveScore.bowlTeamName || "Team 2",
                    runs: latestLiveScore.runs ?? 0,
                    wickets: latestLiveScore.wickets ?? 0,
                    overs: latestLiveScore.overs ?? "0.0"
                });
            }

            if (cards.length === 0) {
                container.innerHTML = `<p class="text-slate-500 text-sm">No live matches at the moment.</p>`;
                return;
            }

            cards.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg cursor-pointer hover:border-amber-400 transition";
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-emerald-400 font-semibold mb-2">
                        <span class="bg-emerald-950 px-2.5 py-0.5 rounded-full border border-emerald-800">LIVE</span>
                        <span class="text-slate-400">Overs: ${item.overs}</span>
                    </div>
                    <div class="flex justify-between items-center text-base font-bold">
                        <span>${item.t1} vs ${item.t2}</span>
                        <span class="text-amber-400">${item.runs}-${item.wickets}</span>
                    </div>
                `;

                card.onclick = () => {
                    const params = new URLSearchParams({
                        matchId: item.matchId,
                        t: item.tourId || "",
                        u: targetUser
                    });
                    window.location.href = `live-score.html?${params.toString()}`;
                };

                container.appendChild(card);
            });
        }

        function attachScoreListenerFor(targetUser) {
            if (unsubscribeScore) {
                unsubscribeScore();
                unsubscribeScore = null;
            }
            const scoreRef = ref(db, `live_matches/${targetUser}/score`);
            unsubscribeScore = onValue(scoreRef, (snap) => {
                latestLiveScore = snap.val();
                renderLiveMatches(targetUser);
            });
        }

        onAuthStateChanged(auth, (user) => {
            const targetUser = resolveScoreUserName();
            attachScoreListenerFor(targetUser);

            if (unsubscribeTours) {
                unsubscribeTours();
                unsubscribeTours = null;
            }

            if (user) {
                unsubscribeTours = onValue(ref(db, `users/${user.uid}/tournaments`), (snap) => {
                    latestTourMatches = snap.val();
                    renderLiveMatches(targetUser);
                });
            } else {
                latestTourMatches = null;
                renderLiveMatches(targetUser);
            }
        });
    </script>
</body>
</html>
