<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 850px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .header-nav { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px; }
        h2, h3 { color: #1e3c72; font-family: 'Oswald', sans-serif; text-transform: uppercase; margin: 0; }
        
        .box { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; overflow: hidden; }
        .box-header { padding: 15px 18px; background: #f1f5f9; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .box-header:hover { background: #e2e8f0; }
        .box-header h3 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .toggle-icon { font-size: 16px; color: #555; transition: transform 0.3s ease; }
        
        .box-content { padding: 18px; border-top: 1px solid #ddd; background: #fff; display: none; }
        .box-content.open { display: block; }

        label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; color: #444; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .btn:hover { background: #218838; }

        .tournament-list { list-style: none; padding: 0; margin-top: 10px; }
        .tournament-item { background: #fff; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
        
        .tournament-name-text { color: #1e3c72; font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px; }

        .btn-delete-icon { background: rgba(220, 53, 69, 0.1); color: #dc3545; border: 1px solid rgba(220, 53, 69, 0.3); width: 32px; height: 32px; border-radius: 5px; cursor: pointer; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-delete-icon:hover { background: #dc3545; color: white; }

                /* ================= সব পেজের জন্য সমান হেডার ================= */
.fb-header-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 42px;
    background: #ffffff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    z-index: 1000;
    font-family: 'Poppins', sans-serif;
    text-transform: none;
    box-sizing: border-box;
}

.fb-nav-tabs {
    display: flex;
    width: 100%;
    height: 42px;
    max-width: 900px;
    margin: 0 auto;
    padding: 0;
    box-sizing: border-box;
}

.fb-tab-btn {
    flex: 1 1 0;
    width: 0;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #65676b;
    font-size: 18px;
    line-height: 1;
    padding: 0;
    margin: 0;
    border: none;
    border-bottom: 3px solid transparent;
    background: transparent;
    box-sizing: border-box;
    overflow: hidden;
}

.fb-tab-btn:hover,
.fb-tab-btn.active {
    color: #1877f2;
    border-bottom-color: #1877f2;
}
/* ============================================================ */


        /* ================= সাইড মেনু (Drawer) CSS ================= */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    z-index: 1001;
}

.overlay.show {
    display: block;
}

.side-drawer {
    position: fixed;
    top: 0;
    left: -295px;
    width: 285px;
    height: 100%;
    background-color: #ffffff;
    z-index: 1002;
    transition: left 0.3s ease;
    box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.side-drawer.open {
    left: 0;
}

.drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid #e4e6eb;
    background-color: #f8f9fa;
}

.drawer-header h3 {
    font-size: 17px;
    color: #050505;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
}

.close-drawer {
    background: #e4e6eb;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    color: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
}

.drawer-links {
    list-style: none;
    padding: 10px;
    margin: 0;
    overflow-y: auto;
    flex: 1;
}

.drawer-links li {
    margin-bottom: 4px;
}

.drawer-links a,
.drawer-links .drawer-version-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    text-decoration: none;
    color: #050505;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    transition: background 0.2s;
}

.drawer-item-left {
    display: flex;
    align-items: center;
    gap: 14px;
}

.drawer-links a:hover {
    background-color: #f0f2f5;
    color: #0866ff;
}

.drawer-links i {
    width: 22px;
    text-align: center;
    font-size: 17px;
}

.version-badge-text {
    font-size: 12px;
    font-weight: 700;
    color: #0866ff;
    background: #e7f3ff;
    padding: 2px 8px;
    border-radius: 10px;
}

        
    </style>
</head>
<body>

    <!-- ================= সাইড মেনু বার (৯টি অপশন ও লোগোসহ) ================= -->
<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

<aside class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
        <h3><i class="fa-solid fa-baseball-bat-ball" style="color: #0866ff;"></i> Local Cricket Live</h3>

            <i class="fa-solid fa-xmark"></i>

    </div>

        <!-- ১. Login -->
        <li>
            <a href="https://lcricket.github.io/s/index.html">
                <span class="drawer-item-left"><i class="fa-solid fa-shield-halved" style="color: #0866ff;"></i> Login</span>
            </a>
        </li>
        <!-- ২. Profile -->
        <li>
            <a href="https://lcricket.github.io/s/profile.html">

        <li>

            <a href="https://play.google.com/store/apps/dev?id=6590894441433938633" target="_blank" rel="noopener noreferrer">
                <span class="drawer-item-left"><i class="fa-solid fa-border-all" style="color: #42b72a;"></i> More Apps</span>
            </a>
        </li>
        <!-- ৫. Contact Whatsapp -->
        <li>
            <a href="https://wa.me/918327321495?text=Hello%20Local%20Cricket%20Live%20Support%2C%20I%20need%20help." target="_blank" rel="noopener noreferrer">
                <span class="drawer-item-left"><i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> Contact Whatsapp</span>
            </a>
        </li>
        <!-- ৬. Support -->
        <li>
            <a href="https://www.facebook.com/kolkatasports0" target="_blank" rel="noopener noreferrer">
                <span class="drawer-item-left"><i class="fa-solid fa-headset" style="color: #e67e22;"></i> Support</span>

        </li>
        <!-- ৭. privacy Policy -->
        <li>
            <a href="https://doc-hosting.flycricket.io/cricket-live-with-scoreboard-privacy-policy/190919ed-e06d-4196-bae2-d63052765d2d/privacy" target="_blank" rel="noopener noreferrer">

            </a>

        <li>

        <!-- ৯. App Version -->

                <span class="drawer-item-left"><i class="fa-solid fa-code-branch" style="color: #0866ff;"></i> App Version</span>
                <span class="version-badge-text" id="app-version-display">v1.8</span>
            </div>

    </ul>
</aside>

<script>
    const APP_VERSION = "v1.8";
    const versionEl = document.getElementById('app-version-display');
    if (versionEl) versionEl.innerText = APP_VERSION;

    function toggleDrawer() {
        const drawer = document.getElementById('sideDrawer');
        const overlay = document.getElementById('overlay');
        if (drawer && overlay) {
            drawer.classList.toggle('open');
            overlay.classList.toggle('show');
        }
    }

    function shareApp(event) {
        const shareUrl = event.currentTarget.getAttribute('href');
        if (navigator.share) {
            event.preventDefault();
            navigator.share({
                title: 'Local Cricket Live Scoreboard',
                text: 'Download Local Cricket Live Scoreboard App:',
                url: shareUrl
            }).catch(() => {
                window.open(shareUrl, '_blank');
            });
        }
    }
</script>

    
<div class="container">
    <div class="header-nav">
        <h2 id="tourTitle">🏆 Tournaments Hub</h2>
    </div>

    <!-- Create Tournament Section -->
    <div class="box">
        <div class="box-header" onclick="toggleSection(this)">
            <h3>➕ Create New Tournament</h3>
            <span class="toggle-icon">▼</span>
        </div>
        <div class="box-content">
            <label>Tournament Name</label>
            <input type="text" id="tourNameInput" placeholder="e.g. Summer Premier League 2026">
            <button class="btn" onclick="window.createTournament()">Create Tournament</button>
        </div>
    </div>

    <!-- Tournaments List Section -->
    <div class="box">
        <div class="box-header" onclick="toggleSection(this)">
            <h3>📋 My Tournaments List</h3>
            <span class="toggle-icon">▼</span>
        </div>
        <div class="box-content open">
            <ul id="tournamentsListContainer" class="tournament-list">
                <li style="text-align:center; color:#888; width: 100%;">Loading tournaments...</li>
            </ul>
        </div>
    </div>
</div>

<script>
    function toggleSection(headerElement) {
        const content = headerElement.nextElementSibling;
        const icon = headerElement.querySelector('.toggle-icon');
        const isOpen = content.classList.contains('open');

        document.querySelectorAll('.box-content').forEach(item => item.classList.remove('open'));
        document.querySelectorAll('.toggle-icon').forEach(ic => ic.style.transform = 'rotate(0deg)');

        if (!isOpen) {
            content.classList.add('open');
            icon.style.transform = 'rotate(180deg)';
        }
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getDatabase, ref, get, set, push, remove } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
      authDomain: "cricket-score-d187a.firebaseapp.com",
      databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
      projectId: "cricket-score-d187a",
      storageBucket: "cricket-score-d187a.firebasestorage.app",
      messagingSenderId: "782741896785",
      appId: "1:782741896785:android:ca8c45a9120f7784928270"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUsername = localStorage.getItem('proCricketUsername') || "user";
    let currentUserId = "";

    async function init() {
        const userRef = ref(db, 'usernames/' + currentUsername);
        const snap = await get(userRef);
        currentUserId = snap.exists() ? snap.val() : currentUsername;
        loadAllTournaments();
    }

    window.createTournament = async function() {
        const tName = document.getElementById('tourNameInput').value.trim();
        if (!tName) {
            alert("⚠️ Please enter a tournament name!");
            return;
        }

        try {
            const newTourRef = push(ref(db, `users/${currentUserId}/tournaments`));
            await set(newTourRef, { name: tName, createdAt: Date.now() });
            document.getElementById('tourNameInput').value = "";
            loadAllTournaments();
            alert("🏆 Tournament created successfully!");
        } catch (err) {
            alert("❌ Failed to create tournament.");
        }
    };

    async function loadAllTournaments() {
        const container = document.getElementById('tournamentsListContainer');
        try {
            const tourSnap = await get(ref(db, `users/${currentUserId}/tournaments`));
            if (tourSnap.exists()) {
                const tours = tourSnap.val();
                container.innerHTML = "";
                Object.keys(tours).forEach(tId => {
                    const tour = tours[tId];
                    let li = document.createElement('li');
                    li.className = "tournament-item";
                    
                    // এখানে লিংক এবং অ্যারো বাদ দেওয়া হয়েছে, শুধু নাম এবং ডানপাশে ডাস্টবিন রাখা হয়েছে
                    li.innerHTML = `
                        <span class="tournament-name-text">🏆 ${tour.name || 'Unnamed Tournament'}</span>
                        <button class="btn-delete-icon" onclick="window.deleteTournament('${tId}')" title="Delete Tournament">🗑️</button>
                    `;
                    container.appendChild(li);
                });
            } else {
                container.innerHTML = "<li style='text-align:center; color:#888; width: 100%;'>No tournaments found. Create one above!</li>";
            }
        } catch (e) {
            container.innerHTML = "<li style='text-align:center; color:red; width: 100%;'>Error loading tournaments.</li>";
        }
    }

    window.deleteTournament = async function(tId) {
        if (!confirm("⚠️ Are you sure you want to delete this tournament?")) return;
        try {
            await remove(ref(db, `users/${currentUserId}/tournaments/${tId}`));
            alert("🗑️ Tournament deleted successfully!");
            loadAllTournaments();
        } catch (err) {
            alert("❌ Failed to delete tournament.");
        }
    };

    onAuthStateChanged(auth, (user) => {
        if (user) { init(); } else { window.location.href = "index.html"; }
    });
</script>
