<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Cricket - Public Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Official Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        
        /* ক্রিকেট ফিড হেডার */
        .app-header { 
            background: #ffffff; 
            padding: 12px 15px; 
            border-radius: 10px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 15px; 
            text-align: center;
            border-bottom: 3px solid #0056b3;
        }
        .app-header h2 { 
            margin: 0; 
            font-family: 'Oswald', sans-serif; 
            color: #1e3c72; 
            font-size: 20px; 
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-link { background: #0056b3; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
        
        /* পোস্ট আপলোড বক্স */
        .upload-box { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 15px; }
        .upload-box input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; }
        .upload-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; flex-wrap: wrap; gap: 10px; }
        
        /* ফিড পোস্ট কার্ড */
        .post-card { background: #fff; border-radius: 10px; box-shadow: 0 3px 12px rgba(0,0,0,0.06); margin-bottom: 15px; overflow: hidden; padding: 12px; position: relative; border-left: 4px solid transparent; }
        .post-card.favorite-post { border-left-color: #f39c12; background: #fffdf5; }
        
        .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .post-user-profile { display: flex; align-items: center; gap: 10px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .post-user-info h4 { margin: 0; font-size: 15px; color: #333; }
        .post-user-info span { font-size: 10px; color: #777; }
        
        /* অ্যাকশন বাটনস */
        .post-actions { display: flex; gap: 6px; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 4px; border-radius: 4px; transition: 0.2s; }
        .action-btn:hover { background: #f0f0f0; }
        
        .photo-title { font-size: 15px; font-weight: bold; color: #1e3c72; margin-bottom: 5px; font-family: 'Oswald', sans-serif; letter-spacing: 0.5px; }
        .post-image { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-top: 5px; }
        
        /* গোল বৃত্তাকার সোশ্যাল মিডিয়া অফিশিয়াল লোগো বাটন */
        .post-footer { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
        .share-label { font-size: 11px; color: #666; font-weight: bold; }
        .share-buttons { display: flex; gap: 8px; align-items: center; }
        
        .social-icon-btn { 
            width: 34px; 
            height: 34px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 15px; 
            color: white; 
            text-decoration: none; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.15); 
            transition: transform 0.2s, opacity 0.2s; 
        }
        .social-icon-btn:hover { transform: scale(1.1); opacity: 0.9; }

        .btn-whatsapp { background-color: #25d366; }
        .btn-facebook { background-color: #1877f2; }
        .btn-twitter { background-color: #000000; }
        .btn-instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
        .btn-youtube { background-color: #ff0000; }

        .limit-notice { font-size: 11px; color: #e67e22; background: #fef5e7; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; }
        .auth-prompt { background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; border: 1px solid #ffeeba; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="container">

    <!-- ক্রিকেট ফিড হেডার -->
    <div class="app-header">
        <h2>🏏 Cricket Feed</h2>
    </div>

    <!-- লগইন রিমাইন্ডার -->
    <div id="authPrompt" class="auth-prompt">
        ⚠️ You need to be logged in to share match moments. <a href="login.html" style="color: #0056b3; font-weight: bold;">Sign In Here</a>
    </div>

    <!-- পোস্ট আপলোড বক্স -->
    <div class="upload-box" id="uploadBoxSection">
        <input type="text" id="photoTitleInput" placeholder="Post Title">

        <div class="upload-controls">
            <input type="file" id="postImageFile" accept="image/*" style="font-size: 12px;">
            <button class="btn-link" style="background: #28a745; padding: 8px 16px;" onclick="window.createPost()">🚀 Post Now</button>
        </div>
        <p id="uploadStatus" style="font-size: 12px; margin: 6px 0 0 0; color: #0056b3;"></p>
    </div>

    <!-- ফিড লিস্ট -->
    <div id="feedContainer">
        <p style="text-align: center; color: #666; font-size: 13px;">Loading public feed...</p>
    </div>

</div>

<!-- Firebase Scripts -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getDatabase, ref, get, set, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
      authDomain: "cricket-score-d187a.firebaseapp.com",
      databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
      projectId: "cricket-score-d187a",
      storageBucket: "cricket-score-d187a.firebasestorage.app",
      messagingSenderId: "782741896785",
      appId: "1:782741896785:android:ca8c45a9120f7784928270"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentUser = null;
    let currentUsername = "User";
    let userProfilePhoto = "https://via.placeholder.com/40";
    let compressedImageBase64 = "";

    onAuthStateChanged(auth, async (user) => {
        const authPrompt = document.getElementById('authPrompt');
        const uploadBox = document.getElementById('uploadBoxSection');

        if (user) {
            currentUser = user;
            currentUsername = localStorage.getItem('proCricketUsername') || "user";
            
            const userSnap = await get(ref(db, `users/${user.uid}/profile`));
            if (userSnap.exists()) {
                const pData = userSnap.val();
                if (pData.name) currentUsername = pData.name;
                if (pData.photo) userProfilePhoto = pData.photo;
            }

            authPrompt.style.display = "none";
            uploadBox.style.display = "block";
        } else {
            authPrompt.style.display = "block";
            uploadBox.style.display = "none";
        }
        loadPublicFeed();
    });

    document.getElementById('postImageFile').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                };
            };
            reader.readAsDataURL(file);
        }
    });

    // পোস্ট আপলোড এবং ৫টি ছবির লিমিট (FIFO Auto-delete) লজিক
    window.createPost = async function() {
        if (!currentUser) {
            alert("⚠️ Please sign in first!");
            return;
        }

        const photoTitle = document.getElementById('photoTitleInput').value.trim();
        const statusEl = document.getElementById('uploadStatus');

        if (!photoTitle) {
            alert("⚠️ Please enter a post title!");
            return;
        }

        if (!compressedImageBase64) {
            alert("⚠️ Please select an image to post!");
            return;
        }

        statusEl.innerText = "Posting...";

        try {
            const userId = currentUser.uid;
            const userPostsRef = ref(db, `user_posts/${userId}`);
            
            const postsSnap = await get(userPostsRef);
            if (postsSnap.exists()) {
                const postsObj = postsSnap.val();
                let normalPosts = [];

                for (let postId of Object.keys(postsObj)) {
                    const pSnap = await get(ref(db, `public_feed/${postId}`));
                    if (pSnap.exists()) {
                        const pData = pSnap.val();
                        if (!pData.favorite) {
                            normalPosts.push({ id: postId, timestamp: pData.timestamp });
                        }
                    }
                }

                // যদি ৫ বা তার বেশি নরমাল পোস্ট থাকে, তবে সবচেয়ে পুরোনো নরমাল পোস্টটি ডিলিট হবে
                if (normalPosts.length >= 5) {
                    normalPosts.sort((a, b) => a.timestamp - b.timestamp);
                    const oldestNormalPostKey = normalPosts[0].id;
                    
                    await remove(ref(db, `user_posts/${userId}/${oldestNormalPostKey}`));
                    await remove(ref(db, `public_feed/${oldestNormalPostKey}`));
                }
            }

            const newPostData = {
                uid: userId,
                username: currentUsername,
                userPhoto: userProfilePhoto,
                title: photoTitle,
                image: compressedImageBase64,
                favorite: false,
                timestamp: Date.now()
            };

            const newPostRef = push(ref(db, 'public_feed'));
            const postId = newPostRef.key;

            await set(newPostRef, newPostData);
            await set(ref(db, `user_posts/${userId}/${postId}`), true);

            document.getElementById('photoTitleInput').value = "";
            document.getElementById('postImageFile').value = "";
            compressedImageBase64 = "";
            statusEl.innerText = "✅ Posted successfully!";
            setTimeout(() => { statusEl.innerText = ""; }, 3000);

        } catch (err) {
            console.error("Error creating post:", err);
            statusEl.innerText = "❌ Failed to post.";
        }
    };

    window.deletePost = async function(postId, postUid) {
        if (!currentUser || currentUser.uid !== postUid) {
            alert("⚠️ You can only delete your own posts!");
            return;
        }

        if (confirm("🗑️ Are you sure you want to delete this post?")) {
            try {
                await remove(ref(db, `public_feed/${postId}`));
                await remove(ref(db, `user_posts/${currentUser.uid}/${postId}`));
            } catch (err) {
                console.error("Error deleting post:", err);
                alert("❌ Failed to delete post.");
            }
        }
    };

    window.toggleFavorite = async function(postId, currentStatus) {
        if (!currentUser) {
            alert("⚠️ Please sign in first!");
            return;
        }

        try {
            await update(ref(db, `public_feed/${postId}`), {
                favorite: !currentStatus
            });
        } catch (err) {
            console.error("Error updating favorite status:", err);
        }
    };

    function loadPublicFeed() {
        const feedRef = ref(db, 'public_feed');
        onValue(feedRef, (snapshot) => {
            const feedContainer = document.getElementById('feedContainer');
            feedContainer.innerHTML = "";

            if (!snapshot.exists()) {
                feedContainer.innerHTML = `<p style="text-align: center; color: #777; background: #fff; padding: 15px; border-radius: 8px; font-size: 13px;">No posts yet. The feed is waiting for your match moments!</p>`;
                return;
            }

            let postsArray = [];
            snapshot.forEach((childSnap) => {
                postsArray.push({ id: childSnap.key, ...childSnap.val() });
            });

            postsArray.sort((a, b) => {
                if (a.favorite && !b.favorite) return -1;
                if (!a.favorite && b.favorite) return 1;
                return b.timestamp - a.timestamp;
            });

            postsArray.forEach(post => {
                const dateStr = new Date(post.timestamp).toLocaleString();
                let titleHtml = post.title ? `<div class="photo-title">📌 ${post.title}</div>` : "";
                let imageHtml = post.image ? `<img src="${post.image}" class="post-image" alt="Post Image">` : "";

                let deleteButtonHtml = "";
                if (currentUser && currentUser.uid === post.uid) {
                    deleteButtonHtml = `<button class="action-btn" title="Delete Post" onclick="window.deletePost('${post.id}', '${post.uid}')">🗑️</button>`;
                }

                let favIcon = post.favorite ? "⭐" : "☆";
                let favTitle = post.favorite ? "Unfavorite (Allow Auto-delete)" : "Favorite (Pin to Top & Protect from Deletion)";
                let favButtonHtml = `<button class="action-btn" title="${favTitle}" onclick="window.toggleFavorite('${post.id}', ${post.favorite || false})">${favIcon}</button>`;

                let shareText = `🏏 Check out this moment on Cricket Feed!\n`;
                if (post.title) shareText += `Title: ${post.title}\n`;
                shareText += `Shared by: ${post.username}\nLink: ${window.location.href}`;
                
                let encodedText = encodeURIComponent(shareText);
                let pageUrl = encodeURIComponent(window.location.href);

                let whatsappUrl = `https://api.whatsapp.com/send?text=${encodedText}`;
                let facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${pageUrl}`;
                let twitterUrl = `https://twitter.com/intent/tweet?text=${encodedText}`;
                let instagramUrl = `https://www.instagram.com/`;
                let youtubeUrl = `https://www.youtube.com/`;

                const postHTML = `
                    <div class="post-card ${post.favorite ? 'favorite-post' : ''}">
                        <div class="post-header">
                            <div class="post-user-profile">
                                <img src="${post.userPhoto || 'https://via.placeholder.com/40'}" class="post-avatar" alt="Avatar">
                                <div class="post-user-info">
                                    <h4>${post.username}</h4>
                                    <span>${dateStr}</span>
                                </div>
                            </div>
                            <div class="post-actions">
                                ${favButtonHtml}
                                ${deleteButtonHtml}
                            </div>
                        </div>
                        ${titleHtml}
                        ${imageHtml}
                        
                        <div class="post-footer">
                            <span class="share-label">Share:</span>
                            <div class="share-buttons">
                                <a href="${whatsappUrl}" target="_blank" class="social-icon-btn btn-whatsapp" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                                <a href="${facebookUrl}" target="_blank" class="social-icon-btn btn-facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                                <a href="${twitterUrl}" target="_blank" class="social-icon-btn btn-twitter" title="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
                                <a href="${instagramUrl}" target="_blank" class="social-icon-btn btn-instagram" title="Instagram"><i class="fab fa-instagram"></i></a>
                                <a href="${youtubeUrl}" target="_blank" class="social-icon-btn btn-youtube" title="YouTube"><i class="fab fa-youtube"></i></a>
                            </div>
                        </div>
                    </div>
                `;
                feedContainer.innerHTML += postHTML;
            });
        });
    }
</script>

</body>
</html>
