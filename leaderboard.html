<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .header-title { font-family: 'Oswald', sans-serif; color: #1e3c72; font-size: 22px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        /* Selectors */
        .select-box { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-weight: bold; color: #334155; background: #f8fafc; margin-bottom: 15px; cursor: pointer; }
        
        /* Tournament Selector Specific */
        #tournamentSelector { border-color: #007bff; background: #eef2ff; color: #1e3c72; }

        /* Table Styling */
        .leaderboard-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
        .leaderboard-table th { background: #007bff; color: #fff; font-family: 'Oswald', sans-serif; font-weight: 500; padding: 12px; letter-spacing: 0.5px; }
        .leaderboard-table th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .leaderboard-table th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        
        .leaderboard-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; color: #1e293b; vertical-align: middle; }
        .leaderboard-table tr:hover { background: #f8fafc; }

        .player-name { font-weight: bold; color: #0f172a; font-size: 15px; }
        .player-sub { font-size: 12px; color: #64748b; margin-top: 2px; }
        .stat-highlight { font-weight: bold; color: #16a34a; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <span id="tourTitle">📊 Leaderboard</span>
    </div>

    <!-- Tournament Dropdown -->
    <select id="tournamentSelector" class="select-box" onchange="changeTournament()">
        <option value="">⏳ Loading Tournaments...</option>
    </select>

    <!-- Category Dropdown -->
    <select id="leaderboardCategory" class="select-box" onchange="renderLeaderboard()">
        <option value="best_scorer">🏏 Best Scorer (Most Runs)</option>
        <option value="best_bowler">⚾ Best Bowler (Most Wickets)</option>
        <option value="best_wk">🧤 Best Wicket Keeper (Stumpings)</option>
        <option value="best_fielder">🏃 Best Fielder (Run Outs & Catches)</option>
        <option value="best_catcher">👐 Best Catcher (Catches)</option>
    </select>

    <!-- Leaderboard Table Container -->
    <div style="overflow-x: auto;">
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th style="width: 20%;">Pos</th>
                    <th>Player & Stats</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="2" style="text-align:center; color:#888; padding: 20px;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABphVo2kWvqHEkxWSsZuDvnyXk05XzX-0",
      authDomain: "cricket-score-d187a.firebaseapp.com",
      databaseURL: "https://cricket-score-d187a-default-rtdb.firebaseio.com",
      projectId: "cricket-score-d187a",
      storageBucket: "cricket-score-d187a.firebasestorage.app",
      messagingSenderId: "782741896785",
      appId: "1:782741896785:android:ca8c45a9120f7784928270"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let currentMatchUser = urlParams.get('u') || localStorage.getItem('proCricketUsername');
    let currentUserId = "";
    let activeTournamentId = urlParams.get('t');
    let cachedPlayersData = {};

    window.changeTournament = function() {
        const selector = document.getElementById('tournamentSelector');
        activeTournamentId = selector.value;
        
        if (activeTournamentId) {
            document.getElementById('tourTitle').innerText = "🏆 " + selector.options[selector.selectedIndex].text;
            
            // Update URL without reloading
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('t', activeTournamentId);
            window.history.pushState({}, '', newUrl);
        } else {
            document.getElementById('tourTitle').innerText = "📊 Leaderboard";
        }
        
        loadLeaderboardData();
    }

    async function loadLeaderboardData() {
        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#888; padding: 20px;">Loading...</td></tr>`;

        try {
            // Only fetching Tournament data now
            if (activeTournamentId && currentMatchUser) {
                const snap = await get(ref(db, `live_matches/${currentMatchUser}/tournaments_data/${activeTournamentId}/players/`));
                cachedPlayersData = snap.val() || {};
            } else {
                cachedPlayersData = {};
            }
            window.renderLeaderboard();
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#dc3545; padding: 20px;">Failed to load data</td></tr>`;
        }
    }

    window.renderLeaderboard = function() {
        const cat = document.getElementById('leaderboardCategory').value;
        const tbody = document.getElementById('leaderboardBody');
        tbody.innerHTML = "";

        let pArr = Object.keys(cachedPlayersData).map(name => ({ name: name, data: cachedPlayersData[name] }));

        if (pArr.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#888; padding: 20px;">No player records found</td></tr>`;
            return;
        }

        // Sorting based on category
        if (cat === "best_scorer") pArr.sort((a,b) => (b.data.runs||0) - (a.data.runs||0));
        else if (cat === "best_bowler") pArr.sort((a,b) => (b.data.wickets||0) - (a.data.wickets||0));
        else if (cat === "best_wk") pArr.sort((a,b) => (b.data.stumpings||0) - (a.data.stumpings||0));
        else if (cat === "best_fielder") pArr.sort((a,b) => ((b.data.runOuts||0)+(b.data.catches||0)) - ((a.data.runOuts||0)+(a.data.catches||0)));
        else if (cat === "best_catcher") pArr.sort((a,b) => (b.data.catches||0) - (a.data.catches||0));

        pArr.forEach((p, idx) => {
            let statText = "";
            let mainVal = "";

            if (cat === "best_scorer") {
                mainVal = `${p.data.runs || 0} <span style="font-size:11px; font-weight:normal; color:#64748b;">(${p.data.balls || 0}b)</span>`;
                statText = `4s: ${p.data.fours || 0} | 6s: ${p.data.sixes || 0} | Mat: ${p.data.matchesPlayed || 1}`;
            } else if (cat === "best_bowler") {
                mainVal = `${p.data.wickets || 0} Wkts`;
                statText = `Ov: ${p.data.oversBowled || "0.0"} | R: ${p.data.runsConceded || 0} | Mat: ${p.data.matchesPlayed || 1}`;
            } else if (cat === "best_wk") {
                mainVal = `${p.data.stumpings || 0} Stumps`;
                statText = `Matches Played: ${p.data.matchesPlayed || 1}`;
            } else if (cat === "best_fielder") {
                mainVal = `${(p.data.runOuts || 0) + (p.data.catches || 0)} Dismissals`;
                statText = `RO: ${p.data.runOuts || 0} | Catches: ${p.data.catches || 0}`;
            } else if (cat === "best_catcher") {
                mainVal = `${p.data.catches || 0} Catches`;
                statText = `Matches Played: ${p.data.matchesPlayed || 1}`;
            }

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: bold; color: #1e3c72;">${idx + 1}.</td>
                <td>
                    <div class="player-name">${p.name}</div>
                    <div class="player-sub">${statText}</div>
                    <div style="margin-top: 4px;"><span class="stat-highlight">${mainVal}</span></div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUserId = user.uid;
            if (!currentMatchUser) {
                currentMatchUser = localStorage.getItem('proCricketUsername') || "user";
            }
            
            // Fetch all tournaments
            try {
                const toursSnap = await get(ref(db, `users/${currentUserId}/tournaments/`));
                const selector = document.getElementById('tournamentSelector');
                
                if (toursSnap.exists()) {
                    const toursData = toursSnap.val();
                    selector.innerHTML = '<option value="">-- Select a Tournament --</option>';
                    
                    for (let tId in toursData) {
                        let opt = document.createElement('option');
                        opt.value = tId;
                        opt.textContent = toursData[tId].name || "Unnamed Tournament";
                        
                        if (tId === activeTournamentId) {
                            opt.selected = true;
                            document.getElementById('tourTitle').innerText = "🏆 " + opt.textContent;
                        }
                        selector.appendChild(opt);
                    }
                    
                    if (!activeTournamentId && selector.options.length > 1) {
                        selector.selectedIndex = 1;
                        window.changeTournament(); 
                    }
                } else {
                    selector.innerHTML = '<option value="">No Tournaments Found</option>';
                }
            } catch(e) {
                console.error("Error fetching tournaments:", e);
                document.getElementById('tournamentSelector').innerHTML = '<option value="">Error loading tournaments</option>';
            }
            
            loadLeaderboardData();
        } else {
            alert("⚠️ Please login first.");
            window.location.href = "index.html";
        }
    });
</script>

</body>
</html>
